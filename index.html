const INITIAL=JSON.parse(document.getElementById('seed').textContent),KEY='ITO_OFFLINE_WEEK43_2026_V04';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!db||!db.people)db=JSON.parse(JSON.stringify(INITIAL));for(let k in INITIAL)db[k]??=[];let page='overview',week='2026-10-19';const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),N=x=>Number(x||0).toLocaleString('ru-RU',{maximumFractionDigits:1}),SUM=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0),find=(k,id)=>db[k].find(x=>String(x.id)===String(id)),name=(k,id)=>find(k,id)?.name||'—',save=()=>localStorage.setItem(KEY,JSON.stringify(db));const taskPlan=t=>+t.planned||(+t.qty||0)*(+find('operations',t.operation_id)?.norm||0),actual=t=>SUM(db.actuals.filter(a=>a.task_id==t.id),a=>a.hours);

function table(h,rows){return `<div class="table"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x??''}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}">Нет записей</td></tr>`}</table></div>`}

function overview(){let ppl=db.people.filter(p=>+p.active!==0),capacity=SUM(ppl,p=>(+p.weekly||40)-SUM(db.absences.filter(a=>a.person_id==p.id&&a.week===week),a=>a.hours)),planned=SUM(db.assignments.filter(a=>a.week===week),a=>a.hours),fact=SUM(db.actuals.filter(a=>a.week===week),a=>a.hours);let stats=[['Доступный ресурс',capacity],['Запланировано',planned],['Факт времени',fact],['Резерв / дефицит',capacity-planned]];let body=`<div class="cards">${stats.map(x=>`<div class="card"><span class="muted">${x[0]}</span><b>${N(x[1])} ч</b><span class="muted">Неделя ${week}</span></div>`).join('')}</div><div class="two"><div class="panel"><h3>Загрузка команды</h3>${ppl.map(p=>{let cap=(+p.weekly||40)-SUM(db.absences.filter(a=>a.person_id==p.id&&a.week===week),a=>a.hours),h=SUM(db.assignments.filter(a=>a.person_id==p.id&&a.week===week),a=>a.hours);return `<div class="row"><span>${E(p.name)}</span><div class="bar"><div class="fill" style="width:${Math.min(100,cap?h/cap*100:0)}%;background:${h>cap?'#d68a44':'#148b81'}"></div></div><b>${cap?Math.round(h/cap*100):0}%</b></div>`}).join('')}</div><div class="panel"><h3>Проекты</h3>${db.projects.map(p=>`<div class="row"><span>${E(p.name)}</span><div class="bar"><div class="fill" style="width:${Math.min(100,db.tasks.filter(t=>t.project_id==p.id).length*12)}%"></div></div><b>${db.tasks.filter(t=>t.project_id==p.id).length} задач</b></div>`).join('')}</div></div><div class="note">Загрузка не равна эффективности. Для оценки результата учитываются принятые задачи, фактические часы, переделки и причины отклонений.</div>`;frame('Пульт управления ИТО','Планирование ресурсов отдела',body,`<input type="date" value="${week}" onchange="week=this.value;render()"><button class="btn" onclick="go('planning')">Планировать</button>`)}
function planning(){let body=`<div class="note">Создай задачу, назначь сотрудника и неделю, затем внеси фактические часы. Результат фиксируется через приёмку задачи.</div>${table(['Задача','Проект','Операция','План, ч','Факт, ч','Принято',''],db.tasks.map(t=>[E(t.title),E(name('projects',t.project_id)),E(name('operations',t.operation_id)),N(taskPlan(t)),N(actual(t)),+t.accepted?'Да':'Нет',`<button class="link" onclick="edit('tasks','${t.id}')">Изменить</button>`]))}<div class="two"><div class="panel"><h3>Назначения</h3>${table(['Задача','Сотрудник','Неделя','Часы'],db.assignments.map(a=>[E(find('tasks',a.task_id)?.title),E(name('people',a.person_id)),E(a.week),N(a.hours)]))}</div><div class="panel"><h3>Факт</h3>${table(['Дата','Задача','Сотрудник','Часы'],db.actuals.map(a=>[E(a.day),E(find('tasks',a.task_id)?.title),E(name('people',a.person_id)),N(a.hours)]))}</div></div>`;frame('Планирование','Задачи, назначения и часы',body,`<button class="btn" onclick="edit('tasks')">+ Задача</button><button class="btn alt" onclick="edit('assignments')">+ Назначение</button><button class="btn alt" onclick="edit('actuals')">+ Факт</button><button class="btn alt" onclick="edit('absences')">+ Отсутствие</button>`)}
function simple(k,title,subtitle,h,rows){frame(title,subtitle,table(h,rows),`<button class="btn" onclick="edit('${k}')">+ Добавить</button>`)}
function effect(){let a=db.tasks.filter(t=>+t.accepted===1),p=SUM(a,taskPlan),f=SUM(a,actual),body=`<div class="cards">${[['Принято задач',a.length],['План принятых',N(p)+' ч'],['Факт принятых',N(f)+' ч'],['План / факт',f?(p/f).toFixed(2):'Нет данных']].map(x=>`<div class="card"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="note">Коэффициент план/факт рассчитан только по принятым задачам. Не использовать его как рейтинг сотрудников без учёта сложности, изменений задания и качества.</div>${table(['Задача','План','Факт','Переделки','Причина','Приёмка'],db.tasks.map(t=>[E(t.title),N(taskPlan(t)),N(actual(t)),N(t.rework),E(t.reason),`<button class="link" onclick="edit('tasks','${t.id}')">${+t.accepted?'Принято':'Не принято'}</button>`]))}`;frame('Эффективность','Результат и отклонения по трудоёмкости',body)}
function download(filename,content,mime){let url=URL.createObjectURL(new Blob([content],{type:mime})),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download('ITO_full_backup.json',JSON.stringify({version:1,data:db},null,2),'application/json')}
function importBackup(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result),d=x.data||x;if(!Array.isArray(d.people)||!Array.isArray(d.tasks)||!Array.isArray(d.projects))throw Error('Некорректный формат');if(!confirm('Заменить всю текущую базу?'))return;db=d;for(let k in INITIAL)db[k]??=[];save();go('overview')}catch(e){alert('Ошибка: '+e.message)}};r.readAsText(f)}
function csv(k){let rows=db[k],keys=[...new Set(rows.flatMap(Object.keys))];download('ITO_'+k+'.csv','\ufeff'+[keys,...rows.map(r=>keys.map(x=>r[x]??''))].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv')}
function exchange(){frame('Обмен данными','Перенос между компьютерами и выгрузки',`<div class="two"><div class="panel"><h3>Полная резервная копия</h3><p>Все сотрудники, проекты, операции, задачи, назначения и фактические часы в одном файле.</p><button class="btn" onclick="backup()">Скачать JSON</button></div><div class="panel"><h3>Восстановление</h3><p>Выбери JSON из другой установки. Текущая база будет заменена после подтверждения.</p><input type="file" accept=".json" onchange="importBackup(this)"></div></div><div class="panel" style="margin-top:16px"><h3>Экспорт в CSV для Excel</h3><div class="buttons">${['people','projects','operations','tasks','assignments','actuals'].map(k=>`<button class="btn alt" onclick="csv('${k}')">${k}</button>`).join('')}</div></div><div class="note">Это полностью автономная версия без сервера. Автоматическая синхронизация между браузерами и импорт XLSX из Bitrix24 пока не реализованы. Для переноса используйте JSON.</div>`)}
function method(){let body=`<div class="note"><b>Инициатива:</b> переход от учёта занятости к прогнозированию ресурсов и измерению принятого результата. План 19–25 октября — экспертная оценка, не подтверждённый факт.</div><div class="two"><div class="panel"><h3>Объективные метрики — сейчас</h3><p>Ресурс: рабочие часы минус отсутствия.</p><p>Загрузка: плановые назначения / доступный ресурс.</p><p>Выполнение: принятый объём / запланированный объём.</p><p>Трудоёмкость: план / факт только для принятых работ.</p><p>Качество: переделки, замечания, повторные работы.</p><p>Причины: блокировки, изменения ТЗ, ожидания, ошибки оценки.</p></div><div class="panel"><h3>Субъективные метрики — позже</h3><p>Самооценка энергии, нагрузки, ясности задач, поддержки. Оценка самостоятельности по карте операций.</p><p>Методологические ориентиры: Performance Management (Aguinis), 360° feedback, Job Demands–Resources, NASA-TLX.</p><p>Оценка «мотивация 7/10» не равна 70% производительности. Такие показатели не применяются как автоматические штрафные коэффициенты.</p></div></div><div class="panel" style="margin-top:16px"><h3>Дорожная карта</h3><p>Недельный план → история версий → Bitrix24 → приёмка → проверка норм по Грозному → компетенции → объективные KPI → осторожная проверка субъективных гипотез.</p><p>Эффективность СМР (внешние подрядчики, стоимость, сроки, качество) и ПНР (внутренние часы, испытания, результат) — отдельные методики.</p></div>`;frame('Методология эффективности','Основа расчётов и направления развития',body)}

function potential(){let ppl=db.people.filter(p=>p.id.startsWith('E')||p.id==='X01');let rows=ppl.map(p=>{let a=(db.assessments||[]).find(x=>x.person_id===p.id&&x.week===week)||{};return [E(p.name),E(p.role),a.competence??'—',a.autonomy??'—',a.energy??'—',a.motivation??'—',a.conditions??'—',`<button class="link" onclick="assess('${p.id}')">Оценить</button>`]});frame('Потенциал команды','Субъективная оценка отдельно от фактической производительности',`<div class="note">Экспертная оценка компетенций и самостоятельности руководителем; добровольная самооценка энергии, мотивации и условий сотрудником. Пустое поле не равно нулю. Оценки не изменяют ресурс часов и не означают процент производительности.</div>${table(['Сотрудник','Роль','Компетенция','Самостоятельность','Энергия','Мотивация','Условия',''],rows)}<div class="panel"><h3>Как интерпретируем</h3><p>Фактическая эффективность = принятые результаты и затраченные часы. Потенциальная готовность = экспертные и добровольные оценки, используемые как гипотезы для планирования и развития. Индивидуальные оценки не должны автоматически попадать в отчёт руководству.</p></div>`)}
function assess(pid){let p=find('people',pid),a=(db.assessments||[]).find(x=>x.person_id===pid&&x.week===week)||{};let fields=[['competence','Компетенция — оценка руководителя'],['autonomy','Самостоятельность — оценка руководителя'],['energy','Энергия — самооценка сотрудника'],['motivation','Мотивация — самооценка сотрудника'],['conditions','Условия — самооценка сотрудника']];let controls=fields.map(([k,l])=>`<label>${l}<select name="${k}"><option value="">Не оценено</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}" ${a[k]===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label>`).join('');document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="subjectiveDialog"><div class="modal"><h3>${E(p.name)}</h3><p>Оценка на неделю ${week}. Не вводите самооценку за сотрудника без его ответа.</p><form class="form" id="subjectiveForm">${controls}</form><div class="modalbuttons"><button class="btn alt" onclick="document.getElementById('subjectiveDialog').remove()">Отмена</button><button class="btn" onclick="saveAssessment('${pid}')">Сохранить</button></div></div></div>`)}
function saveAssessment(pid){let f=document.getElementById('subjectiveForm'),a={person_id:pid,week};for(let k of ['competence','autonomy','energy','motivation','conditions']){let v=f.elements[k].value;a[k]=v===''?null:Number(v)}db.assessments=db.assessments||[];db.assessments=db.assessments.filter(x=>!(x.person_id===pid&&x.week===week));db.assessments.push(a);localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('subjectiveDialog').remove();render()}

function go(p){page=p;render()}
function render(){if(page==='overview')overview();if(page==='planning')planning();if(page==='effect')effect();if(page==='exchange')exchange();if(page==='method')method();if(page==='potential')potential();if(page==='people')simple('people','Сотрудники','Состав отдела',['ФИО','Роль','Часов в неделю','В расчёте',''],db.people.map(p=>[E(p.name),E(p.role),N(p.weekly),+p.active?'Да':'Нет',`<button class="link" onclick="edit('people','${p.id}')">Изменить</button>`]));if(page==='projects')simple('projects','Проекты','Портфель работ',['Название','Тип',''],db.projects.map(p=>[E(p.name),E(p.kind),`<button class="link" onclick="edit('projects','${p.id}')">Изменить</button>`]));if(page==='operations')simple('operations','Каталог операций','Предварительные нормы',['Операция','Категория','Единица','Норма, ч',''],db.operations.map(o=>[E(o.name),E(o.category),E(o.unit),N(o.norm),`<button class="link" onclick="edit('operations','${o.id}')">Изменить</button>`]))}
const schemas={people:[['name','ФИО','text'],['role','Роль','text'],['weekly','Норма ч/нед','number'],['active','В расчёте (1/0)','number']],projects:[['name','Название','text'],['kind','Тип','text']],operations:[['name','Операция','text'],['category','Направление','text'],['unit','Единица','text'],['norm','Часов на единицу','number']],tasks:[['title','Задача','text'],['project_id','Проект','projects'],['operation_id','Операция','operations'],['qty','Объём','number'],['planned','План часов (0 = по норме)','number'],['due','Срок','date'],['status','Статус','text'],['accepted','Принято (1/0)','number'],['rework','Переделки, ч','number'],['reason','Причина отклонения','text']],assignments:[['task_id','Задача','tasks'],['person_id','Исполнитель','people'],['week','Неделя (понедельник)','date'],['hours','План часов','number']],actuals:[['task_id','Задача','tasks'],['person_id','Исполнитель','people'],['day','Дата','date'],['hours','Факт часов','number']],absences:[['person_id','Сотрудник','people'],['week','Неделя','date'],['hours','Отсутствие, ч','number'],['reason','Причина','text']]};
function edit(k,id){let x=id?find(k,id):{},fields=schemas[k],controls=fields.map(([field,label,type])=>{let value=x?.[field]??(field==='week'?week:field==='active'?1:field==='accepted'?0:'');let control=['people','projects','operations','tasks'].includes(type)?`<select name="${field}"><option value="">Выбрать...</option>${db[type].map(item=>`<option value="${E(item.id)}" ${String(value)===String(item.id)?'selected':''}>${E(item.title||item.name)}</option>`).join('')}</select>`:`<input name="${field}" type="${type}" value="${E(value)}" step="${type==='number'?'0.25':'1'}">`;return `<label>${label}${control}</label>`}).join('');let overlay=document.createElement('div');overlay.className='overlay';overlay.id='editor';overlay.innerHTML=`<div class="modal"><h2>${id?'Редактировать':'Добавить'} · ${k}</h2><form id="entry" class="form">${controls}</form><div class="modalbuttons"><button class="btn alt" onclick="document.getElementById('editor').remove()">Отмена</button><button class="btn" onclick="commit('${k}','${id||''}')">Сохранить</button></div></div>`;document.body.appendChild(overlay)}
function commit(k,id){let fields=schemas[k],form=document.getElementById('entry'),obj=id?find(k,id):{id:k==='people'||k==='projects'||k==='operations'?'NEW'+Date.now():Date.now()};for(let [field,label,type] of fields){let v=form.elements.namedItem(field).value;if(['number'].includes(type))v=Number(v||0);else if(['people','projects','operations','tasks'].includes(type)&&v!==''&&/^\d+$/.test(v))v=Number(v);obj[field]=v}if(!id)db[k].push(obj);if(k==='actuals')obj.week=(obj.day?(()=>{let d=new Date(obj.day+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);return d.toISOString().slice(0,10)})():week);try{save();document.getElementById('editor').remove();render()}catch(e){alert('Ошибка сохранения: '+e.message)}}
render();
</script></html>
